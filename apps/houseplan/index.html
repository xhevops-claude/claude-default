<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>House Wireframe</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <style>
    /* Critical inline CSS — paints black on the very first frame, before
       styles.css resolves. Do not move this to styles.css. */
    html, body {
      margin: 0; padding: 0; height: 100%;
      touch-action: manipulation;
      background: #000; color: #cfe9f5;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .gl-bar {
      position: relative; width: 160px; height: 1px;
      background: rgba(143, 216, 255, 0.18); overflow: hidden;
    }
    #app-loading .gl-bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: #8fd8ff;
      animation: gl-bar 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes gl-bar { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
  <link rel="stylesheet" href="styles.css?v=ca061b1" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app-loading"><div class="gl-bar" aria-label="Loading"></div></div>

  <main class="wf">
    <div class="stage" id="stage">
      <div class="canvas-host" id="canvas-host"></div>
      <div class="fail" id="fail" hidden>
        Could not start the 3D view — three.js did not load.
      </div>
      <!-- Sits over the gizmo's corner of the canvas and takes its taps,
           so snapping a view never fights the orbit drag underneath. -->
      <div class="gizmo-hit" id="gizmo-hit" title="Snap to an axis"></div>
    </div>

    <header class="hud hud--top">
      <div class="hud-title">
        <span id="wf-name">House</span>
        <span class="hud-dim" id="wf-dims"></span>
        <span class="hud-sel" id="wf-sel"></span>
      </div>
      <button type="button" class="ghost ghost--icon" id="settings-open" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3.3H9l-.4 2.6a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1l.4 2.6h6l.4-2.6a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
      <button type="button" class="ghost" id="quit" aria-label="Quit">&#10005;</button>
    </header>

    <!-- Settings: which layers show, how the view moves, and the language.
         Opened by the gear. The layer rows are filled in by app.js. -->
    <div class="sheet" id="settings" hidden>
      <div class="sheet-backdrop" id="settings-backdrop"></div>
      <div class="sheet-panel" role="dialog" aria-labelledby="settings-title">
        <div class="sheet-head">
          <span class="sheet-title" id="settings-title" data-i18n="Settings">Settings</span>
          <button type="button" class="ghost" id="settings-close" data-i18n="Close">Close</button>
        </div>
        <div class="setting">
          <div class="setting-label" data-i18n="Layers">Layers</div>
          <div class="setting-row">
            <label class="check check--all"><input type="checkbox" id="layers-all" /><span data-i18n="All layers">All layers</span></label>
            <span class="setting-actions">
              <button type="button" class="ghost" id="layers-save" data-i18n="Save" disabled>Save</button>
              <button type="button" class="ghost" id="layers-reset" data-i18n="Reset">Reset</button>
            </span>
          </div>
          <ul class="layers" id="layers"></ul>
        </div>
        <div class="setting">
          <div class="setting-label" data-i18n="Navigation">Navigation</div>
          <div class="seg" id="seg-mode">
            <button type="button" class="seg-btn is-on" data-mode="object" data-i18n="Object">Object</button>
            <button type="button" class="seg-btn" data-mode="camera" data-i18n="Camera">Camera</button>
          </div>
          <div class="setting-hint" id="mode-hint"></div>
        </div>
        <div class="setting">
          <div class="setting-label" data-i18n="Language">Language</div>
          <div class="seg" id="seg-lang">
            <button type="button" class="seg-btn is-on" data-lang="en">EN</button>
            <button type="button" class="seg-btn" data-lang="de">DE</button>
          </div>
        </div>
      </div>
    </div>

    <!-- One chip per object group, in its colour; tap to hide the group. -->
    <nav class="hud hud--legend" id="legend" aria-label="Object groups"></nav>

    <footer class="hud hud--bottom">
      <button type="button" class="ghost" id="fit" data-i18n="Fit">Fit</button>
      <button type="button" class="ghost is-on" id="t-faces" data-i18n="Faces">Faces</button>
      <button type="button" class="ghost is-on" id="t-floors" data-i18n="Floors">Floors</button>
      <button type="button" class="ghost is-on" id="t-dots" data-i18n="Dots">Dots</button>
      <button type="button" class="ghost is-on" id="t-grid" data-i18n="Ground">Ground</button>
      <button type="button" class="ghost" id="t-spin" data-i18n="Spin">Spin</button>
      <a class="ghost" href="defects.html" target="_blank" rel="noopener" data-i18n="Defects">Defects</a>
      <span class="axis-key" id="axis-key">
        <b class="ax-x">X</b> east · <b class="ax-y">Y</b> up · <b class="ax-z">Z</b> south
      </span>
    </footer>
  </main>

  <script src="plan.js?v=ca061b1"></script>
  <script src="relief.js?v=ca061b1"></script>
  <script type="module" src="app.js?v=ca061b1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>House Plans</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <style>
    /* Critical inline CSS — paints the splash on the very first frame,
       before styles.css resolves. Do not move this to styles.css. */
    html, body {
      margin: 0; padding: 0; height: 100%;
      touch-action: manipulation;
      background: #10151c; color: #e7edf5;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
    }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: inherit;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 0.35s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .gl-icon { font-size: 84px; line-height: 1; }
    #app-loading .gl-bar {
      position: relative; width: 180px; height: 3px;
      background: rgba(255, 255, 255, 0.16); overflow: hidden;
    }
    #app-loading .gl-bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: #8ab4f8;
      animation: gl-bar 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    @keyframes gl-bar { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app-loading">
    <span class="gl-icon" aria-hidden="true">🏠</span>
    <div class="gl-bar" aria-label="Loading"></div>
  </div>

  <main class="hp">
    <header class="bar bar--top">
      <div class="title">
        <span class="title-name" id="plan-name">House Plans</span>
        <span class="title-sub" id="plan-sub"></span>
      </div>
      <div class="seg" role="tablist" aria-label="View">
        <button type="button" class="seg-btn is-on" id="view-plan" role="tab" aria-selected="true">Plan</button>
        <button type="button" class="seg-btn" id="view-3d" role="tab" aria-selected="false">3D</button>
      </div>
      <button type="button" class="icon-btn" id="quit" aria-label="Quit">&#10005;</button>
    </header>

    <section class="stage" id="stage">
      <div class="pane pane--plan" id="pane-plan">
        <div class="svg-host" id="svg-host"></div>
        <div class="readout" id="readout" hidden></div>
      </div>
      <div class="pane pane--3d" id="pane-3d" hidden>
        <div class="canvas-host" id="canvas-host"></div>
        <div class="webgl-fail" id="webgl-fail" hidden>
          This browser could not start WebGL, so the 3D view is unavailable. The plan view still works.
        </div>
      </div>
    </section>

    <div class="rail" id="rail" aria-label="Level"></div>

    <footer class="bar bar--bottom">
      <button type="button" class="chip" id="btn-fit">Fit</button>
      <details class="opts" id="opts">
        <summary class="chip chip--summary">Options</summary>
        <div class="opts-sheet">
          <div class="opts-group" id="opts-plan">
            <label class="opt"><input type="checkbox" id="o-dims" checked /><span>Dimensions</span></label>
            <label class="opt"><input type="checkbox" id="o-furn" checked /><span>Furniture</span></label>
            <label class="opt"><input type="checkbox" id="o-labels" checked /><span>Room labels</span></label>
            <label class="opt"><input type="checkbox" id="o-ghost" checked /><span>Level below</span></label>
            <label class="opt"><input type="checkbox" id="o-grid" /><span>1 m grid</span></label>
            <label class="opt"><input type="checkbox" id="o-schedule" /><span>Room schedule</span></label>
          </div>
          <div class="opts-group" id="opts-3d" hidden>
            <label class="opt"><input type="checkbox" id="o-roof" checked /><span>Roof</span></label>
            <label class="opt"><input type="checkbox" id="o-furn3" checked /><span>Furniture</span></label>
            <label class="opt"><input type="checkbox" id="o-cut" /><span>Dollhouse cut</span></label>
            <label class="opt opt--range">
              <span>Explode</span>
              <input type="range" id="o-explode" min="0" max="6" step="0.1" value="0" />
            </label>
          </div>
        </div>
      </details>
      <span class="hint" id="hint"></span>
    </footer>
  </main>

  <script src="plan.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

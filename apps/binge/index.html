<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binge</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <style>
    /* Critical inline CSS: paint the splash on the first frame, before
       styles.css resolves. Self-contained palette; the shell does not
       theme sub-experiences. */
    html, body { margin: 0; padding: 0; background: #0c0d12; color: #f4f5fb;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation; }
    #app-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(120% 90% at 50% 16%, #181b27 0%, #0c0d12 64%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; transition: opacity 0.45s ease;
    }
    #app-loading.hidden { opacity: 0; pointer-events: none; }
    #app-loading .gl-icon { font-size: 80px; line-height: 1; filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.55)); }
    #app-loading .gl-word { font-weight: 800; letter-spacing: 0.4em; font-size: 13px;
      text-transform: uppercase; color: #fca5a5; padding-left: 0.4em; }
    #app-loading .gl-bar { position: relative; width: 184px; height: 3px;
      background: rgba(252, 165, 165, 0.16); overflow: hidden; border-radius: 2px; }
    #app-loading .gl-bar::after { content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b);
      animation: gl-run 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    @keyframes gl-run { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
  <link rel="stylesheet" href="styles.css?v=b4b87ad" />
</head>
<body>
  <div id="app-loading">
    <span class="gl-icon" aria-hidden="true">🍿</span>
    <span class="gl-word">Loading</span>
    <div class="gl-bar" aria-label="Loading"></div>
  </div>

  <main class="binge">
    <header class="bg-head">
      <span class="bg-logo" aria-hidden="true">🍿</span>
      <div class="bg-titles">
        <h1>Binge</h1>
        <p>Watch channels start to finish, in order.</p>
      </div>
      <button id="channels-btn" type="button" class="btn ghost head-btn">Channels</button>
    </header>

    <!-- Player -->
    <section class="player-wrap" id="player-wrap" hidden>
      <div class="player-frame">
        <div id="player"></div>
        <div class="player-veil" id="veil" hidden>
          <span class="veil-text" id="veil-text">Loading…</span>
          <a id="veil-link" class="veil-link" href="#" target="_blank" rel="noopener" hidden>Watch on YouTube ↗</a>
        </div>
      </div>
      <div class="now">
        <div class="now-meta">
          <div class="now-title" id="now-title">—</div>
          <div class="now-by" id="now-by">—</div>
        </div>
      </div>
      <div class="now-actions">
        <button id="watched-next" type="button" class="btn primary">✓ Watched · next</button>
        <button id="skip" type="button" class="btn ghost">Skip ›</button>
        <a id="yt-link" class="btn ghost" href="#" target="_blank" rel="noopener">YouTube ↗</a>
        <button id="close-player" type="button" class="btn ghost">✕ Close</button>
      </div>
    </section>

    <!-- Mode -->
    <section class="controls">
      <div class="seg" role="tablist" aria-label="Order">
        <button id="mode-timeline" type="button" class="seg-btn" role="tab">Timeline</button>
        <button id="mode-channel" type="button" class="seg-btn" role="tab">By channel</button>
      </div>
    </section>

    <!-- Channel switcher (By channel mode) -->
    <div class="chan-strip" id="chan-strip" hidden></div>

    <!-- Filter section: whole section collapses; sliders inside stay open -->
    <section class="filters" id="filters" hidden>
      <button class="filters-head" id="filters-toggle" type="button" aria-expanded="true" aria-controls="filters-body">
        <span class="filters-chev" aria-hidden="true">▸</span>
        <span class="filters-title">Show up to</span>
        <span class="filters-summary" id="filters-summary">up to today</span>
      </button>

      <div class="filters-body" id="filters-body">
        <div class="dslider" id="ds-year">
          <div class="dslider-row">
            <span class="dslider-label">Year</span>
            <span class="dslider-value" id="yr-value">Any</span>
          </div>
          <input type="range" id="f-year" class="d-range" min="0" max="0" step="1" value="0" aria-label="Year" />
        </div>

        <div class="dslider" id="ds-month">
          <div class="dslider-row">
            <span class="dslider-label">Month</span>
            <span class="dslider-value" id="mo-value">Any</span>
          </div>
          <input type="range" id="f-month" class="d-range" min="1" max="12" step="1" value="1" aria-label="Month" />
        </div>

        <div class="dslider" id="ds-day">
          <div class="dslider-row">
            <span class="dslider-label">Day</span>
            <span class="dslider-value" id="dy-value">Any</span>
          </div>
          <input type="range" id="f-day" class="d-range" min="1" max="31" step="1" value="1" aria-label="Day" />
        </div>

        <div class="filters-foot">
          <label class="chk"><input type="checkbox" id="hide-watched" /> Hide watched</label>
          <button id="filters-reset" type="button" class="btn ghost small">Today</button>
        </div>
      </div>
    </section>

    <!-- Progress -->
    <div class="progress" id="progress" hidden>
      <div class="progress-bar"><span id="progress-fill"></span></div>
      <span class="progress-text" id="progress-text">—</span>
    </div>

    <!-- Results accordion -->
    <div class="results-bar" id="results-bar" hidden>
      <span class="results-count" id="results-count">—</span>
      <button id="collapse-all" type="button" class="btn ghost small">Expand all</button>
    </div>
    <section class="years" id="years" aria-label="Videos by year"></section>

    <!-- Empty / status -->
    <section class="status-panel" id="status-panel">
      <div class="status-icon" aria-hidden="true">🍿</div>
      <div class="status-msg" id="status-msg">Loading channels…</div>
      <button id="status-action" type="button" class="btn primary" hidden></button>
    </section>

    <div class="hud">
      <button id="quit" type="button" class="btn ghost">Quit</button>
    </div>
  </main>

  <!-- Channels drawer -->
  <div class="drawer" id="drawer" hidden role="dialog" aria-label="Channels">
    <div class="drawer-head">
      <span class="drawer-title">Channels</span>
      <button id="drawer-close" type="button" class="drawer-close" aria-label="Close">×</button>
    </div>
    <p class="drawer-sub" id="drawer-sub">Follow channels to add them to your binge.</p>
    <ul class="chan-list" id="chan-list"></ul>
    <div class="drawer-foot">
      <button id="clear-watched" type="button" class="btn ghost small">Clear watched history</button>
    </div>
  </div>

  <script src="app.js?v=b4b87ad"></script>
</body>
</html>

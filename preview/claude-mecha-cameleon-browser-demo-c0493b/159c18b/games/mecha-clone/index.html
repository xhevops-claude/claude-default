<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mecha Clone</title>
  <script>
    if (window.self !== window.top) document.documentElement.classList.add('embedded');
  </script>
  <!-- Critical inline CSS so the loading screen paints on the first
       frame, before styles.css resolves. -->
  <style>
    html, body { margin: 0; padding: 0; background: #0b0f14; color: #d7e4e8;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    #game-loading {
      position: fixed; inset: 0; z-index: 9999;
      background: #0b0f14;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 0.4s ease;
    }
    #game-loading.hidden { opacity: 0; pointer-events: none; }
    #game-loading .gl-icon { font-size: 88px; line-height: 1; }
    #game-loading .gl-bar {
      position: relative; width: 180px; height: 4px;
      background: rgba(61, 220, 132, 0.15); overflow: hidden;
    }
    #game-loading .gl-bar::after {
      content: ""; position: absolute; top: 0; left: -40%;
      width: 40%; height: 100%; background: #3ddc84;
      animation: gl-bar 1.2s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    @keyframes gl-bar { 0% { left: -40%; } 100% { left: 100%; } }
  </style>
  <link rel="stylesheet" href="styles.css?v=159c18b" />
</head>
<body>
  <div id="game-loading">
    <span class="gl-icon" aria-hidden="true">🦎</span>
    <div class="gl-bar" aria-label="Loading"></div>
  </div>

  <main class="stage">
    <div class="scoreboard">
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Wave</span>
        <span class="stat-value" id="wave">1</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-value" id="best">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="480" height="480" aria-label="Mecha Clone arena"></canvas>
      <div class="phase-banner" id="phase-banner" aria-live="polite"></div>
      <div class="overlay" id="overlay" data-state="ready">
        <h2 id="overlay-title">Mecha Clone</h2>
        <p id="overlay-text">
          A rogue seeker sweeps the arena. Match your camo plating to the
          floor tile under you and freeze while the beam passes — or get
          spotted. Grab power cores between sweeps.
        </p>
        <div class="overlay-actions">
          <button id="action-btn" type="button">Play</button>
          <button id="quit-btn" type="button" class="ghost">Quit</button>
        </div>
      </div>
    </div>

    <div class="camo-bar" id="camo-bar" role="group" aria-label="Camouflage color"></div>

    <div class="hint">
      <span class="hint-keys"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>WASD</kbd> move · <kbd>Space</kbd>/<kbd>C</kbd> cycle camo</span>
      <span class="hint-touch">Swipe to move · tap a swatch to change camo</span>
    </div>
  </main>

  <script src="app.js?v=159c18b"></script>
</body>
</html>
